<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aman Shukla | Download Dataset</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      padding: 1rem;
      box-sizing: border-box;
    }

    .container {
      background-color: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #2c3e50;
      font-size: 2.2rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .download-button {
      display: inline-flex; /* For aligning icon and text */
      align-items: center; /* For aligning icon and text */
      justify-content: center; /* For aligning icon and text */
      padding: 15px 35px;
      background: linear-gradient(45deg, #007bff, #0056b3);
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      border: none; /* Remove default border */
      cursor: pointer;
    }

    .download-button:hover,
    .download-button:focus {
      background: linear-gradient(45deg, #0056b3, #003d80);
      box-shadow: 0 6px 20px rgba(0, 86, 179, 0.4);
      transform: translateY(-3px); /* Slight lift effect */
      outline: none; /* Remove focus outline if custom styling is preferred */
    }

    .download-button:active {
      transform: translateY(-1px); /* Click effect */
      box-shadow: 0 3px 10px rgba(0, 86, 179, 0.3);
    }

    /* Optional: Style for an icon if you add one */
    .download-button svg {
      margin-right: 10px;
      width: 20px;
      height: 20px;
    }

    .footer-text {
        margin-top: 2.5rem;
        font-size: 0.9rem;
        color: #777;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Aman Shukla's Dataset Hub</h1>
    <p>
      Access the dataset you need with a simple click. The file is provided in txt format.
    </p>
    <a href="https://snap.stanford.edu/data/facebook_combined.txt.gz" download class="download-button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24" style="margin-right: 8px;">

      </svg>
      Download Dataset
    </a>
    <p class="footer-text">&copy; 2025 Aman Shukla. All Rights Reserved.</p>
  </div>
</body>
</html>
